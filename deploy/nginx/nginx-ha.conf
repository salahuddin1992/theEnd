# =============================================================================
# Nginx Configuration for HA Cluster
# إعدادات Nginx لموازنة الحمل بين Masters
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Upstream للـ Masters
    upstream masters {
        # يفضل الاتصال بـ master1 (الأولوية الأعلى)
        server master1:8080 weight=3;
        server master2:8080 weight=2 backup;
        server master3:8080 weight=1 backup;

        # Health check
        # keepalive للأداء
        keepalive 32;
    }

    # Upstream لكل Masters (للـ health checks)
    upstream all_masters {
        server master1:8080;
        server master2:8080;
        server master3:8080;
    }

    server {
        listen 80;
        server_name _;

        # API requests
        location / {
            proxy_pass http://masters;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Retry on failure
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # WebSocket support
        location /ws {
            proxy_pass http://masters;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket timeout
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Status page
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
