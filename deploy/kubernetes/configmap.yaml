apiVersion: v1
kind: ConfigMap
metadata:
  name: dc-master-config
  namespace: distributed-cluster
  labels:
    app.kubernetes.io/name: distributed-cluster
    app.kubernetes.io/component: master
data:
  master-config.json: |
    {
      "host": "0.0.0.0",
      "port": 8080,
      "log_level": "INFO",
      "heartbeat_timeout_seconds": 60,
      "max_concurrent_jobs_per_worker": 10,
      "scheduler_interval_seconds": 1.0,
      "worker_cleanup_interval_seconds": 30,
      "database_url": "sqlite:///data/cluster.db",
      "enable_metrics": true,
      "metrics_port": 9090
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dc-worker-config
  namespace: distributed-cluster
  labels:
    app.kubernetes.io/name: distributed-cluster
    app.kubernetes.io/component: worker
data:
  worker-config.json: |
    {
      "master_url": "http://dc-master-service:8080",
      "heartbeat_interval_seconds": 15,
      "max_concurrent_jobs": 5,
      "enable_docker": true,
      "resource_reserve_cpu": 0.5,
      "resource_reserve_memory_mb": 512
    }
