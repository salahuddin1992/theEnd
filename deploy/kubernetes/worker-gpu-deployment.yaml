apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-worker-gpu
  namespace: distributed-cluster
  labels:
    app.kubernetes.io/name: distributed-cluster
    app.kubernetes.io/component: worker-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-cluster
      app.kubernetes.io/component: worker-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-cluster
        app.kubernetes.io/component: worker-gpu
    spec:
      serviceAccountName: dc-worker
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: distributed-cluster:latest-gpu
          imagePullPolicy: IfNotPresent
          command: ["dc-worker", "start"]
          args:
            - "--master"
            - "http://dc-master-service:8765"
            - "--tags"
            - "gpu,cuda,ml"
          env:
            - name: DC_LOG_LEVEL
              value: "INFO"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8000m"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
