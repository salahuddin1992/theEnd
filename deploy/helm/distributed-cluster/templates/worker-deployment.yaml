{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distributed-cluster.fullname" . }}-worker
  labels:
    {{- include "distributed-cluster.worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "distributed-cluster.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distributed-cluster.worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "distributed-cluster.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["dc-worker", "start"]
          args:
            - "--master"
            - "{{ include "distributed-cluster.masterUrl" . }}"
            {{- if .Values.worker.config.tags }}
            - "--tags"
            - "{{ join "," .Values.worker.config.tags }}"
            {{- end }}
          env:
            - name: DC_LOG_LEVEL
              value: {{ .Values.master.config.logLevel | quote }}
            - name: DC_HEARTBEAT_INTERVAL
              value: {{ .Values.worker.config.heartbeatIntervalSeconds | quote }}
            - name: DC_MAX_CONCURRENT_JOBS
              value: {{ .Values.worker.config.maxConcurrentJobs | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.worker.config.enableDocker }}
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
          {{- end }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f dc-worker"
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- if .Values.worker.config.enableDocker }}
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
