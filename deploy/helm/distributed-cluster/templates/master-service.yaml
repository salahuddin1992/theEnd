{{- if .Values.master.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distributed-cluster.fullname" . }}-master
  labels:
    {{- include "distributed-cluster.master.labels" . | nindent 4 }}
spec:
  type: {{ .Values.master.service.type }}
  ports:
    - name: http
      port: {{ .Values.master.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.master.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "distributed-cluster.master.selectorLabels" . | nindent 4 }}
{{- end }}
