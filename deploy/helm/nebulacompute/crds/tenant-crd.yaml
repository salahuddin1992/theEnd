apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.nebulacompute.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  labels:
    app.kubernetes.io/name: nebulacompute
    app.kubernetes.io/component: crd
spec:
  group: nebulacompute.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
    shortNames:
      - nct
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Jobs
          type: integer
          jsonPath: .status.activeJobs
        - name: Workers
          type: integer
          jsonPath: .status.workerCount
        - name: CPU Used
          type: string
          jsonPath: .status.resourceUsage.cpu
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: "Tenant display name"
                  minLength: 1
                  maxLength: 63
                description:
                  type: string
                  description: "Tenant description"
                admin:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    name:
                      type: string
                  description: "Tenant administrator"
                quotas:
                  type: object
                  properties:
                    maxJobs:
                      type: integer
                      minimum: 1
                      default: 100
                      description: "Maximum concurrent jobs"
                    maxWorkers:
                      type: integer
                      minimum: 0
                      default: 10
                      description: "Maximum dedicated workers"
                    maxCPU:
                      type: string
                      default: "100"
                      description: "Maximum CPU cores"
                    maxMemory:
                      type: string
                      default: "200Gi"
                      description: "Maximum memory"
                    maxGPU:
                      type: integer
                      minimum: 0
                      default: 4
                      description: "Maximum GPUs"
                    maxStorage:
                      type: string
                      default: "500Gi"
                      description: "Maximum storage"
                    maxJobDuration:
                      type: integer
                      default: 86400
                      description: "Maximum job duration in seconds"
                  description: "Resource quotas"
                isolation:
                  type: string
                  enum: ["shared", "dedicated", "namespace"]
                  default: "shared"
                  description: "Isolation level"
                namespace:
                  type: string
                  description: "Dedicated namespace (for namespace isolation)"
                priority:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
                  description: "Tenant priority (higher = more priority)"
                billing:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    plan:
                      type: string
                      enum: ["free", "starter", "professional", "enterprise"]
                      default: "free"
                    creditLimit:
                      type: number
                      description: "Credit limit in dollars"
                  description: "Billing configuration"
                notifications:
                  type: object
                  properties:
                    email:
                      type: array
                      items:
                        type: string
                        format: email
                    slack:
                      type: string
                    webhook:
                      type: string
                  description: "Notification settings"
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Custom labels"
                suspended:
                  type: boolean
                  default: false
                  description: "Whether tenant is suspended"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Active", "Suspended", "Terminating", "QuotaExceeded"]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                namespaceCreated:
                  type: boolean
                  description: "Whether dedicated namespace is created"
                activeJobs:
                  type: integer
                  description: "Current active jobs"
                totalJobs:
                  type: integer
                  description: "Total jobs submitted"
                completedJobs:
                  type: integer
                  description: "Completed jobs"
                failedJobs:
                  type: integer
                  description: "Failed jobs"
                workerCount:
                  type: integer
                  description: "Dedicated worker count"
                resourceUsage:
                  type: object
                  properties:
                    cpu:
                      type: string
                      description: "Current CPU usage"
                    memory:
                      type: string
                      description: "Current memory usage"
                    gpu:
                      type: integer
                      description: "Current GPU usage"
                    storage:
                      type: string
                      description: "Current storage usage"
                  description: "Current resource usage"
                quotaUsage:
                  type: object
                  properties:
                    jobsPercent:
                      type: number
                    cpuPercent:
                      type: number
                    memoryPercent:
                      type: number
                    gpuPercent:
                      type: number
                    storagePercent:
                      type: number
                  description: "Quota usage percentages"
                billing:
                  type: object
                  properties:
                    currentBalance:
                      type: number
                    totalSpent:
                      type: number
                    lastBillingDate:
                      type: string
                      format: date-time
                  description: "Billing status"
                lastActivity:
                  type: string
                  format: date-time
                  description: "Last activity timestamp"
                observedGeneration:
                  type: integer
                  format: int64
