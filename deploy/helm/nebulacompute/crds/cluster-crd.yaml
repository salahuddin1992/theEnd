apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.nebulacompute.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  labels:
    app.kubernetes.io/name: nebulacompute
    app.kubernetes.io/component: crd
spec:
  group: nebulacompute.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
    shortNames:
      - nc
      - ncc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.workers.replicas
          statusReplicasPath: .status.workerCount
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Workers
          type: integer
          jsonPath: .status.workerCount
        - name: Jobs
          type: integer
          jsonPath: .status.activeJobs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - master
              properties:
                master:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 5
                      default: 1
                    image:
                      type: string
                      default: "nebulacompute/nebulacompute:latest"
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "500m"
                            memory:
                              type: string
                              default: "1Gi"
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "2000m"
                            memory:
                              type: string
                              default: "4Gi"
                    config:
                      type: object
                      properties:
                        logLevel:
                          type: string
                          enum: ["DEBUG", "INFO", "WARNING", "ERROR"]
                          default: "INFO"
                        maxJobs:
                          type: integer
                          default: 10000
                        jobTimeout:
                          type: integer
                          default: 3600
                workers:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      minimum: 0
                      maximum: 1000
                      default: 2
                    image:
                      type: string
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "1000m"
                            memory:
                              type: string
                              default: "2Gi"
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "4000m"
                            memory:
                              type: string
                              default: "8Gi"
                    gpu:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        count:
                          type: integer
                          default: 1
                        type:
                          type: string
                          enum: ["nvidia", "amd"]
                          default: "nvidia"
                    autoscaling:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        minReplicas:
                          type: integer
                          default: 2
                        maxReplicas:
                          type: integer
                          default: 10
                        targetCPU:
                          type: integer
                          default: 70
                        targetMemory:
                          type: integer
                          default: 80
                security:
                  type: object
                  properties:
                    auth:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        type:
                          type: string
                          enum: ["jwt", "oauth2", "ldap"]
                          default: "jwt"
                    rbac:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    tls:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        secretName:
                          type: string
                storage:
                  type: object
                  properties:
                    backend:
                      type: string
                      enum: ["sqlite", "postgresql", "redis"]
                      default: "sqlite"
                    persistence:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        size:
                          type: string
                          default: "10Gi"
                        storageClass:
                          type: string
                multiTenancy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    isolation:
                      type: string
                      enum: ["namespace", "cluster"]
                      default: "namespace"
                backup:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    schedule:
                      type: string
                      default: "0 2 * * *"
                    retention:
                      type: object
                      properties:
                        daily:
                          type: integer
                          default: 7
                        weekly:
                          type: integer
                          default: 4
                        monthly:
                          type: integer
                          default: 3
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Failed", "Terminating"]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                masterEndpoint:
                  type: string
                workerCount:
                  type: integer
                readyWorkers:
                  type: integer
                activeJobs:
                  type: integer
                completedJobs:
                  type: integer
                failedJobs:
                  type: integer
                lastBackup:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
