apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: computejobs.nebulacompute.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  labels:
    app.kubernetes.io/name: nebulacompute
    app.kubernetes.io/component: crd
spec:
  group: nebulacompute.io
  names:
    kind: ComputeJob
    listKind: ComputeJobList
    plural: computejobs
    singular: computejob
    shortNames:
      - cj
      - ncjob
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Priority
          type: string
          jsonPath: .spec.priority
        - name: Worker
          type: string
          jsonPath: .status.assignedWorker
        - name: Duration
          type: string
          jsonPath: .status.duration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - command
              properties:
                command:
                  type: string
                  description: "Command to execute"
                args:
                  type: array
                  items:
                    type: string
                  description: "Command arguments"
                image:
                  type: string
                  description: "Docker image for the job"
                priority:
                  type: string
                  enum: ["LOW", "NORMAL", "HIGH", "CRITICAL"]
                  default: "NORMAL"
                resources:
                  type: object
                  properties:
                    cpu:
                      type: number
                      minimum: 0.1
                      default: 1.0
                    memory:
                      type: integer
                      minimum: 128
                      default: 1024
                      description: "Memory in MB"
                    gpu:
                      type: integer
                      minimum: 0
                      default: 0
                    gpuMemory:
                      type: integer
                      description: "GPU memory in MB"
                timeout:
                  type: integer
                  minimum: 1
                  default: 3600
                  description: "Timeout in seconds"
                retries:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 3
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Environment variables"
                envFrom:
                  type: array
                  items:
                    type: object
                    properties:
                      secretRef:
                        type: object
                        properties:
                          name:
                            type: string
                      configMapRef:
                        type: object
                        properties:
                          name:
                            type: string
                workingDir:
                  type: string
                  description: "Working directory"
                inputs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      source:
                        type: string
                      path:
                        type: string
                  description: "Input files/artifacts"
                outputs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      path:
                        type: string
                  description: "Output files/artifacts"
                workerSelector:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Worker node selector"
                workerTags:
                  type: array
                  items:
                    type: string
                  description: "Required worker tags"
                dependencies:
                  type: array
                  items:
                    type: string
                  description: "Job dependencies (other job names)"
                notifications:
                  type: object
                  properties:
                    onSuccess:
                      type: array
                      items:
                        type: string
                    onFailure:
                      type: array
                      items:
                        type: string
                tenant:
                  type: string
                  description: "Tenant ID for multi-tenancy"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Scheduled", "Running", "Completed", "Failed", "Cancelled", "Timeout"]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                jobId:
                  type: string
                  description: "Internal job ID"
                assignedWorker:
                  type: string
                  description: "Assigned worker name"
                scheduledAt:
                  type: string
                  format: date-time
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                duration:
                  type: string
                  description: "Job duration"
                exitCode:
                  type: integer
                  description: "Exit code of the job"
                retryCount:
                  type: integer
                  description: "Number of retries"
                output:
                  type: string
                  description: "Job output (truncated)"
                error:
                  type: string
                  description: "Error message if failed"
                artifacts:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      path:
                        type: string
                      size:
                        type: integer
                  description: "Output artifacts"
                resourceUsage:
                  type: object
                  properties:
                    cpuSeconds:
                      type: number
                    memoryMBSeconds:
                      type: number
                    gpuSeconds:
                      type: number
                observedGeneration:
                  type: integer
                  format: int64
