{{- if .Values.security.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nebulacompute.fullname" . }}-secrets
  labels:
    {{- include "nebulacompute.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ include "nebulacompute.jwtSecret" . | b64enc | quote }}
  worker-token: {{ randAlphaNum 32 | b64enc | quote }}
  {{- if eq .Values.storage.backend "postgresql" }}
  postgres-password: {{ .Values.storage.postgresql.password | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.storage.backend "redis" }}
  redis-password: {{ .Values.storage.redis.password | b64enc | quote }}
  {{- end }}
{{- end }}
