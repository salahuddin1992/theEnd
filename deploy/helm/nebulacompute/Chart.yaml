apiVersion: v2
name: nebulacompute
description: A Helm chart for NebulaCompute - Distributed Computing System
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - distributed-computing
  - job-scheduler
  - cluster-management
  - gpu-computing
  - ai-ml
home: https://github.com/nebulacompute/nebulacompute
sources:
  - https://github.com/nebulacompute/nebulacompute
maintainers:
  - name: NebulaCompute Team
    email: team@nebulacompute.io
annotations:
  category: Infrastructure
  licenses: MIT
dependencies:
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
