# =============================================================================
# Docker Compose - High Availability Setup
# نشر 3 Masters + 3 Workers مع توفر عالي
# =============================================================================
#
# الاستخدام:
#   docker-compose -f docker-compose.ha.yml up -d
#
# الهيكل:
#   - 3 Masters (master1 هو الأولوية الأعلى)
#   - 3 Workers (يتصلون بكل Masters)
#   - PostgreSQL (قاعدة بيانات مشتركة)
#   - Load Balancer (nginx)
#
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # Database - قاعدة بيانات مشتركة
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: dc-postgres
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula_secret
      POSTGRES_DB: nebula_cluster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nebula-ha

  # ===========================================================================
  # Masters - 3 سيرفرات رئيسية
  # ===========================================================================

  master1:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: dc-master1
    hostname: master1
    command: >
      dc-ha start-master
      --host 0.0.0.0
      --port 8080
      --id master1
      --priority 100
      --peers master2:8080,master3:8080
      --mode active_standby
    environment:
      DC_LOG_LEVEL: INFO
      DC_DATABASE_TYPE: postgresql
      DC_DATABASE_HOST: postgres
      DC_DATABASE_PORT: 5432
      DC_DATABASE_NAME: nebula_cluster
      DC_DATABASE_USER: nebula
      DC_DATABASE_PASSWORD: nebula_secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nebula-ha

  master2:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: dc-master2
    hostname: master2
    command: >
      dc-ha start-master
      --host 0.0.0.0
      --port 8080
      --id master2
      --priority 50
      --peers master1:8080,master3:8080
      --mode active_standby
    environment:
      DC_LOG_LEVEL: INFO
      DC_DATABASE_TYPE: postgresql
      DC_DATABASE_HOST: postgres
      DC_DATABASE_PORT: 5432
      DC_DATABASE_NAME: nebula_cluster
      DC_DATABASE_USER: nebula
      DC_DATABASE_PASSWORD: nebula_secret
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      master1:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nebula-ha

  master3:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: dc-master3
    hostname: master3
    command: >
      dc-ha start-master
      --host 0.0.0.0
      --port 8080
      --id master3
      --priority 25
      --peers master1:8080,master2:8080
      --mode active_standby
    environment:
      DC_LOG_LEVEL: INFO
      DC_DATABASE_TYPE: postgresql
      DC_DATABASE_HOST: postgres
      DC_DATABASE_PORT: 5432
      DC_DATABASE_NAME: nebula_cluster
      DC_DATABASE_USER: nebula
      DC_DATABASE_PASSWORD: nebula_secret
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      master1:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nebula-ha

  # ===========================================================================
  # Load Balancer - موزع الحمل
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: dc-loadbalancer
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx-ha.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - master1
      - master2
      - master3
    networks:
      - nebula-ha

  # ===========================================================================
  # Workers - 3 عمال
  # ===========================================================================

  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dc-worker1
    hostname: worker1
    command: >
      dc-ha start-worker
      --masters master1:8080,master2:8080,master3:8080
      --tags cpu,worker1
    environment:
      DC_LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker1_data:/tmp/nebula
    depends_on:
      - master1
    networks:
      - nebula-ha

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dc-worker2
    hostname: worker2
    command: >
      dc-ha start-worker
      --masters master1:8080,master2:8080,master3:8080
      --tags cpu,worker2
    environment:
      DC_LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker2_data:/tmp/nebula
    depends_on:
      - master1
    networks:
      - nebula-ha

  worker3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dc-worker3
    hostname: worker3
    command: >
      dc-ha start-worker
      --masters master1:8080,master2:8080,master3:8080
      --tags cpu,worker3
    environment:
      DC_LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker3_data:/tmp/nebula
    depends_on:
      - master1
    networks:
      - nebula-ha

# ===========================================================================
# Networks
# ===========================================================================
networks:
  nebula-ha:
    driver: bridge

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  postgres_data:
  worker1_data:
  worker2_data:
  worker3_data:
