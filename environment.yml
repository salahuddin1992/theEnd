# Conda Environment for theEnd - Distributed Computing System
name: theend-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip>=23.0
  - pip:
    # Core dependencies
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.5.0
    - httpx>=0.25.0
    - websockets>=12.0
    - aiosqlite>=0.19.0
    - psutil>=5.9.0
    - docker>=6.1.0
    - pynvml>=11.5.0
    - typer>=0.9.0
    - rich>=13.0.0
    - python-multipart>=0.0.6
    - aiofiles>=23.0.0
    - jinja2>=3.1.0
    - numpy>=1.24.0
    # Test dependencies
    - pytest>=7.4.0
    - pytest-asyncio>=0.21.0
    - pytest-cov>=4.1.0
    - pytest-timeout>=2.2.0
