# Docker Compose Production Configuration
# ========================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Execution Modes (set via environment):
# - DC_EXECUTION_MODE=auto   : تلقائي (الافتراضي)
# - DC_EXECUTION_MODE=docker : Docker فقط
# - DC_EXECUTION_MODE=direct : مباشر بدون Docker
#
# Docker Permissions (production defaults - more secure):
# - DC_DOCKER_PRIVILEGED=false (unless needed)

version: "3.9"

services:
  master:
    image: ${REGISTRY:-}nebulacompute/master:${VERSION:-latest}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      - NEBULA_LOG_LEVEL=INFO
      - NEBULA_LOG_FORMAT=json
      - NEBULA_ENROLLMENT_MODE=token
      - NEBULA_SECRET_KEY=${NEBULA_SECRET_KEY:?NEBULA_SECRET_KEY is required}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  worker-1:
    image: ${REGISTRY:-}nebulacompute/worker:${VERSION:-latest}
    # Production permissions - configurable via environment
    privileged: ${DC_DOCKER_PRIVILEGED:-true}
    pid: ${DC_DOCKER_HOST_PID_MODE:-host}
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - NEBULA_LOG_LEVEL=INFO
      - NEBULA_WORKER_TAGS=cpu,docker,prod,privileged
      # Execution mode and Docker permissions
      - DC_EXECUTION_MODE=${DC_EXECUTION_MODE:-auto}
      - DC_DOCKER_PRIVILEGED=${DC_DOCKER_PRIVILEGED:-true}
      - DC_DOCKER_HOST_NETWORK=${DC_DOCKER_HOST_NETWORK:-false}
      - DC_DOCKER_HOST_PID=${DC_DOCKER_HOST_PID:-true}
      - DC_DOCKER_ALL_DEVICES=${DC_DOCKER_ALL_DEVICES:-true}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    cap_add:
      - ALL
    security_opt:
      - seccomp:unconfined

  worker-2:
    image: ${REGISTRY:-}nebulacompute/worker:${VERSION:-latest}
    # Production permissions - configurable via environment
    privileged: ${DC_DOCKER_PRIVILEGED:-true}
    pid: ${DC_DOCKER_HOST_PID_MODE:-host}
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - NEBULA_LOG_LEVEL=INFO
      - NEBULA_WORKER_TAGS=cpu,docker,prod,privileged
      # Execution mode and Docker permissions
      - DC_EXECUTION_MODE=${DC_EXECUTION_MODE:-auto}
      - DC_DOCKER_PRIVILEGED=${DC_DOCKER_PRIVILEGED:-true}
      - DC_DOCKER_HOST_NETWORK=${DC_DOCKER_HOST_NETWORK:-false}
      - DC_DOCKER_HOST_PID=${DC_DOCKER_HOST_PID:-true}
      - DC_DOCKER_ALL_DEVICES=${DC_DOCKER_ALL_DEVICES:-true}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    cap_add:
      - ALL
    security_opt:
      - seccomp:unconfined

  # Production uses external MinIO/S3
  minio:
    profiles:
      - never  # Disable MinIO in production, use external S3
