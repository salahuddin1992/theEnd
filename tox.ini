[tox]
envlist = py{310,311,312},lint,type,security
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=7.4.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.1.0
    pytest-xdist>=3.5.0
    hypothesis>=6.92.0
commands =
    pytest {posargs:tests/unit tests/integration} -v --tb=short

[testenv:lint]
deps =
    ruff>=0.1.0
    black>=23.0.0
    isort>=5.12.0
commands =
    ruff check src/ tests/
    black --check src/ tests/
    isort --check-only src/ tests/

[testenv:format]
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black src/ tests/
    isort src/ tests/

[testenv:type]
deps =
    mypy>=1.7.0
    types-requests
    types-PyYAML
commands =
    mypy src/distributed_cluster --ignore-missing-imports

[testenv:security]
deps =
    bandit>=1.7.0
    safety>=2.3.0
    pip-audit>=2.6.0
commands =
    bandit -r src/ -ll
    safety check
    pip-audit

[testenv:docs]
deps =
    mkdocs>=1.5.0
    mkdocs-material>=9.5.0
    mkdocstrings[python]>=0.24.0
commands =
    mkdocs build

[testenv:coverage]
deps =
    {[testenv]deps}
commands =
    pytest tests/unit tests/integration \
        --cov=src/distributed_cluster \
        --cov-report=html \
        --cov-report=xml \
        --cov-report=term-missing \
        --cov-fail-under=80

[testenv:performance]
deps =
    {[testenv]deps}
    pytest-benchmark>=4.0.0
    locust>=2.20.0
commands =
    pytest tests/performance -v --benchmark-only

[testenv:fuzz]
deps =
    {[testenv]deps}
commands =
    pytest tests/fuzz -v --hypothesis-seed=0
