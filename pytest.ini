[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests requiring GPU
    integration: marks integration tests
    e2e: marks end-to-end tests
    performance: marks performance tests
    security: marks security tests
    fuzz: marks fuzz tests

# Output
addopts =
    -ra
    --strict-markers
    --strict-config
    -v
    --tb=short

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning:pynvml.*
    ignore:The pynvml package is deprecated:FutureWarning

# Timeout
timeout = 300
timeout_method = thread

# Coverage
[coverage:run]
source = src/distributed_cluster
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    @abstractmethod
    @abc.abstractmethod
