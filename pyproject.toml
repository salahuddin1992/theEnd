[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-cluster"
version = "0.1.0"
description = "نظام حوسبة موزّعة - Distributed Computing System (Master/Worker Architecture)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "theEnd Team"}
]
keywords = ["distributed", "computing", "cluster", "scheduler", "workers", "GPU", "CPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.0",
    "docker>=6.1.0",
    "pynvml>=11.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
s3 = [
    "boto3>=1.34.0",
]
yaml = [
    "pyyaml>=6.0.0",
]
grpc = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]
desktop = [
    "PySide6>=6.6.0",
    "qasync>=0.27.0",
]
build = [
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
]
all = [
    "distributed-cluster[s3,yaml,grpc,desktop,build]",
]

[project.scripts]
dc-master = "distributed_cluster.cli.master_cli:app"
dc-worker = "distributed_cluster.cli.worker_cli:app"
dc-submit = "distributed_cluster.cli.submit_cli:app"
dc-mesh = "distributed_cluster.cli.mesh_cli:app"
dc-web = "distributed_cluster.cli.web_cli:app"
dc-notify = "distributed_cluster.cli.notify_cli:app"
dc-desktop = "distributed_cluster.desktop.main:main"
dc-ai = "distributed_cluster.cli.ai_cli:main"
dc-inference = "distributed_cluster.ai.inference.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = [
    "N802",  # function name should be lowercase (for Qt/gRPC methods)
    "N803",  # argument name should be lowercase (for ML/math conventions)
    "N806",  # variable in function should be lowercase (for ML/math)
    "E402",  # module level import not at top (needed for optional imports)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
strict_optional = false
disable_error_code = [
    "union-attr",
    "attr-defined",
    "no-any-return",
    "arg-type",
    "override",
    "operator",
    "call-arg",
    "misc",
    "import-untyped",
    "var-annotated",
    "assignment",
    "dict-item",
    "index",
    "valid-type",
    "call-overload",
    "return-value",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:pynvml",
]
