name: 🖥️ Enterprise Desktop Build Pipeline

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# 🎯 TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'claude/**'
    paths:
      - 'src/distributed_cluster/desktop/**'
      - 'src/core/**'
      - 'src/shared/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'requirements*.txt'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

  pull_request:
    branches:
      - main
      - master
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      build_mode:
        description: '🔧 Build Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - minimal
          - standard
          - full
          - ultra

      target_platforms:
        description: '🖥️ Target Platforms'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows-only
          - linux-only
          - macos-only
          - windows-linux
          - windows-macos
          - linux-macos

      build_type:
        description: '📦 Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - release-optimized
          - profile

      enable_signing:
        description: '🔐 Enable Code Signing'
        required: false
        default: true
        type: boolean

      enable_notarization:
        description: '📋 Enable macOS Notarization'
        required: false
        default: true
        type: boolean

      run_tests:
        description: '🧪 Run Test Suite'
        required: false
        default: true
        type: boolean

      run_security_scan:
        description: '🛡️ Run Security Scanning'
        required: false
        default: true
        type: boolean

      create_installers:
        description: '📦 Create Platform Installers'
        required: false
        default: true
        type: boolean

      upload_to_cdn:
        description: '🌐 Upload to CDN'
        required: false
        default: false
        type: boolean

      notify_channels:
        description: '🔔 Notification Channels'
        required: false
        default: 'all'
        type: choice
        options:
          - none
          - slack
          - discord
          - email
          - teams
          - all

      debug_mode:
        description: '🐛 Enable Debug Mode'
        required: false
        default: false
        type: boolean

  schedule:
    # Nightly builds at 2:00 AM UTC
    - cron: '0 2 * * *'
    # Weekly full builds on Sunday at 4:00 AM UTC
    - cron: '0 4 * * 0'

  repository_dispatch:
    types:
      - build-desktop
      - release-desktop
      - hotfix-desktop

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# 🔒 CONCURRENCY CONTROL
# ══════════════════════════════════════════════════════════════════════════════════════════════════
concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# 🌍 GLOBAL ENVIRONMENT VARIABLES
# ══════════════════════════════════════════════════════════════════════════════════════════════════
env:
  # ─── Version & Build Info ───
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'
  
  # ─── Build Configuration ───
  BUILD_MODE: ${{ github.event.inputs.build_mode || 'full' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_ID: ${{ github.run_id }}
  
  # ─── Feature Flags ───
  ENABLE_SIGNING: ${{ github.event.inputs.enable_signing || 'true' }}
  ENABLE_NOTARIZATION: ${{ github.event.inputs.enable_notarization || 'true' }}
  RUN_TESTS: ${{ github.event.inputs.run_tests || 'true' }}
  RUN_SECURITY_SCAN: ${{ github.event.inputs.run_security_scan || 'true' }}
  CREATE_INSTALLERS: ${{ github.event.inputs.create_installers || 'true' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
  
  # ─── Paths ───
  DESKTOP_SRC: 'src/distributed_cluster/desktop'
  BUILD_OUTPUT: 'dist'
  ARTIFACTS_DIR: 'artifacts'
  INSTALLERS_DIR: 'installers'
  REPORTS_DIR: 'reports'
  
  # ─── App Metadata ───
  APP_NAME: 'NebulaCompute'
  APP_ID: 'com.nebulacompute.desktop'
  APP_AUTHOR: 'Dawood AI Team'
  APP_WEBSITE: 'https://nebulacompute.io'
  
  # ─── Cache Keys ───
  CACHE_VERSION: 'v3'
  PIP_CACHE_DIR: ~/.cache/pip
  NPM_CACHE_DIR: ~/.npm
  CARGO_CACHE_DIR: ~/.cargo
  
  # ─── Telemetry ───
  TELEMETRY_ENABLED: 'true'
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# 🔐 PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════════════════════════
permissions:
  contents: write
  packages: write
  actions: read
  security-events: write
  id-token: write
  attestations: write
  pull-requests: write
  issues: write
  discussions: write

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# 🏗️ JOBS
# ══════════════════════════════════════════════════════════════════════════════════════════════════
jobs:
  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 📋 INITIALIZATION & VALIDATION                                                                 ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  initialize:
    name: 📋 Initialize Build Pipeline
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_short: ${{ steps.version.outputs.version_short }}
      build_timestamp: ${{ steps.metadata.outputs.timestamp }}
      build_date: ${{ steps.metadata.outputs.date }}
      commit_sha_short: ${{ steps.metadata.outputs.commit_sha_short }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      is_nightly: ${{ steps.metadata.outputs.is_nightly }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      build_windows: ${{ steps.platforms.outputs.build_windows }}
      build_linux: ${{ steps.platforms.outputs.build_linux }}
      build_macos: ${{ steps.platforms.outputs.build_macos }}
      matrix_include: ${{ steps.matrix.outputs.include }}
      cache_key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔍 Extract Version Information
        id: version
        run: |
          set +e  # Don't exit on error, we handle errors manually
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 EXTRACTING VERSION INFORMATION"
          echo "═══════════════════════════════════════════════════════════"

          # Try multiple version sources
          VERSION=""

          # 1. Check git tags
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "📌 Version from tag: $VERSION"
          fi

          # 2. Check pyproject.toml
          if [ -z "$VERSION" ] && [ -f "pyproject.toml" ]; then
            VERSION=$(grep -E 'version\s*=\s*"[^"]*"' pyproject.toml | head -1 | sed 's/.*version\s*=\s*"\([^"]*\)".*/\1/') || true
            if [ -n "$VERSION" ]; then
              echo "📌 Version from pyproject.toml: $VERSION"
            fi
          fi

          # 3. Check setup.py
          if [ -z "$VERSION" ] && [ -f "setup.py" ]; then
            VERSION=$(grep -E "version\s*=\s*['\"][^'\"]*['\"]" setup.py | head -1 | sed "s/.*version\s*=\s*['\"]\\([^'\"]*\\)['\"].*/\\1/") || true
            if [ -n "$VERSION" ]; then
              echo "📌 Version from setup.py: $VERSION"
            fi
          fi

          # 4. Check __version__.py (with safe find)
          if [ -z "$VERSION" ]; then
            VERSION_FILE=$(find . -maxdepth 4 -type f \( -name "__version__.py" -o -name "_version.py" \) 2>/dev/null | head -1)
            if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
              VERSION=$(grep -E "__version__\s*=\s*['\"][^'\"]*['\"]" "$VERSION_FILE" | head -1 | sed "s/.*__version__\s*=\s*['\"]\\([^'\"]*\\)['\"].*/\\1/") || true
              if [ -n "$VERSION" ]; then
                echo "📌 Version from $VERSION_FILE: $VERSION"
              fi
            fi
          fi

          # 5. Generate version from git (fallback)
          if [ -z "$VERSION" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
            SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            VERSION="0.0.${COMMIT_COUNT}+${SHORT_SHA}"
            echo "📌 Generated version: $VERSION"
          fi

          # Add build metadata for non-release builds
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            BUILD_NUM="${GITHUB_RUN_NUMBER:-0}"
            if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              VERSION="${VERSION}-nightly.${BUILD_NUM}"
            elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              PR_NUM="${GITHUB_EVENT_NUMBER:-$GITHUB_REF_NAME}"
              VERSION="${VERSION}-pr.${PR_NUM}.${BUILD_NUM}"
            else
              VERSION="${VERSION}-dev.${BUILD_NUM}"
            fi
          fi

          # Extract short version (semantic version part)
          VERSION_SHORT=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo "$VERSION" | cut -d'-' -f1 || echo "0.0.0")

          # Ensure we have valid outputs
          VERSION="${VERSION:-0.0.0-dev}"
          VERSION_SHORT="${VERSION_SHORT:-0.0.0}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_short=$VERSION_SHORT" >> $GITHUB_OUTPUT

          echo "═══════════════════════════════════════════════════════════"
          echo "✅ Final Version: $VERSION"
          echo "✅ Short Version: $VERSION_SHORT"
          echo "═══════════════════════════════════════════════════════════"

      - name: 📊 Generate Build Metadata
        id: metadata
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 GENERATING BUILD METADATA"
          echo "═══════════════════════════════════════════════════════════"
          
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          DATE=$(date -u +"%Y-%m-%d")
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          
          # Determine build type
          IS_RELEASE="false"
          IS_PRERELEASE="false"
          IS_NIGHTLY="false"
          
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            IS_RELEASE="true"
            if [[ "$GITHUB_REF" == *"-alpha"* ]] || [[ "$GITHUB_REF" == *"-beta"* ]] || [[ "$GITHUB_REF" == *"-rc"* ]]; then
              IS_PRERELEASE="true"
            fi
          fi
          
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            IS_NIGHTLY="true"
          fi
          
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "commit_sha_short=$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "is_nightly=$IS_NIGHTLY" >> $GITHUB_OUTPUT
          
          # Create build info JSON
          cat > build-info.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "timestamp": "$TIMESTAMP",
            "date": "$DATE",
            "commit": "$COMMIT_SHA_SHORT",
            "branch": "${GITHUB_REF#refs/heads/}",
            "build_number": "$GITHUB_RUN_NUMBER",
            "build_id": "$GITHUB_RUN_ID",
            "is_release": $IS_RELEASE,
            "is_prerelease": $IS_PRERELEASE,
            "is_nightly": $IS_NIGHTLY,
            "triggered_by": "$GITHUB_ACTOR",
            "event": "$GITHUB_EVENT_NAME",
            "repository": "$GITHUB_REPOSITORY"
          }
          EOF
          
          echo "📋 Build Info:"
          cat build-info.json

      - name: 🖥️ Determine Target Platforms
        id: platforms
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🖥️ DETERMINING TARGET PLATFORMS"
          echo "═══════════════════════════════════════════════════════════"
          
          PLATFORM_INPUT="${{ github.event.inputs.target_platforms || 'all' }}"
          
          BUILD_WINDOWS="true"
          BUILD_LINUX="true"
          BUILD_MACOS="true"
          
          case "$PLATFORM_INPUT" in
            "windows-only")
              BUILD_LINUX="false"
              BUILD_MACOS="false"
              ;;
            "linux-only")
              BUILD_WINDOWS="false"
              BUILD_MACOS="false"
              ;;
            "macos-only")
              BUILD_WINDOWS="false"
              BUILD_LINUX="false"
              ;;
            "windows-linux")
              BUILD_MACOS="false"
              ;;
            "windows-macos")
              BUILD_LINUX="false"
              ;;
            "linux-macos")
              BUILD_WINDOWS="false"
              ;;
          esac
          
          echo "build_windows=$BUILD_WINDOWS" >> $GITHUB_OUTPUT
          echo "build_linux=$BUILD_LINUX" >> $GITHUB_OUTPUT
          echo "build_macos=$BUILD_MACOS" >> $GITHUB_OUTPUT
          
          echo "📋 Platform Configuration:"
          echo "  🪟 Windows: $BUILD_WINDOWS"
          echo "  🐧 Linux:   $BUILD_LINUX"
          echo "  🍎 macOS:   $BUILD_MACOS"

      - name: 🔧 Generate Build Matrix
        id: matrix
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔧 GENERATING BUILD MATRIX"
          echo "═══════════════════════════════════════════════════════════"

          MATRIX_INCLUDE="["
          FIRST="true"

          # Get platform values with defaults
          BUILD_WINDOWS="${{ steps.platforms.outputs.build_windows }}"
          BUILD_LINUX="${{ steps.platforms.outputs.build_linux }}"
          BUILD_MACOS="${{ steps.platforms.outputs.build_macos }}"

          # Default to true if not set
          BUILD_WINDOWS="${BUILD_WINDOWS:-true}"
          BUILD_LINUX="${BUILD_LINUX:-true}"
          BUILD_MACOS="${BUILD_MACOS:-true}"

          # Windows configurations only
          MATRIX_INCLUDE+='{"os":"windows-latest","platform":"windows","arch":"x64","runner":"windows-latest","icon":"🪟","artifact_ext":".exe","installer_ext":".msi"}'

          MATRIX_INCLUDE+="]"

          # Fallback: if matrix is empty, add Windows x64
          if [[ "$MATRIX_INCLUDE" == "[]" ]]; then
            echo "⚠️ No platforms selected, using default Windows x64"
            MATRIX_INCLUDE='[{"os":"windows-latest","platform":"windows","arch":"x64","runner":"windows-latest","icon":"🪟","artifact_ext":".exe","installer_ext":".msi"}]'
          fi

          # Validate JSON before setting output
          if echo "$MATRIX_INCLUDE" | jq empty 2>/dev/null; then
            echo "✅ Matrix JSON is valid"
          else
            echo "⚠️ Matrix JSON validation failed, using fallback"
            MATRIX_INCLUDE='[{"os":"ubuntu-latest","platform":"linux","arch":"x64","runner":"ubuntu-latest","icon":"🐧","artifact_ext":"","installer_ext":".deb"}]'
          fi

          echo "include=$MATRIX_INCLUDE" >> $GITHUB_OUTPUT
          echo "📋 Build Matrix:"
          echo "$MATRIX_INCLUDE" | jq . || echo "$MATRIX_INCLUDE"

      - name: 🔑 Generate Cache Key
        id: cache-key
        run: |
          # Generate comprehensive cache key
          FILES_HASH=$(cat requirements*.txt pyproject.toml setup.py setup.cfg 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "no-deps")
          CACHE_KEY="${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${FILES_HASH:0:16}"
          echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "📋 Cache Key: $CACHE_KEY"

      - name: 📝 Generate Changelog
        id: changelog
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📝 GENERATING CHANGELOG"
          echo "═══════════════════════════════════════════════════════════"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD -- . ':!.github' | head -50) || CHANGELOG=""
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -20) || CHANGELOG=""
          fi

          # Use a unique delimiter that won't appear in commit messages
          DELIMITER="CHANGELOG_DELIMITER_$(date +%s)_$$"

          {
            echo "changelog<<${DELIMITER}"
            echo "$CHANGELOG"
            echo "${DELIMITER}"
          } >> $GITHUB_OUTPUT

          echo "📋 Changelog generated with ${#CHANGELOG} characters"

      - name: 📤 Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json
          retention-days: 90

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 🛡️ SECURITY SCANNING                                                                          ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  security-scan:
    name: 🛡️ Security Analysis
    runs-on: ubuntu-latest
    needs: initialize
    if: ${{ needs.initialize.result == 'success' && github.event.inputs.run_security_scan != 'false' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety semgrep pip-audit

      - name: 🔍 Run Bandit (SAST)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 RUNNING BANDIT SECURITY ANALYSIS"
          echo "═══════════════════════════════════════════════════════════"
          mkdir -p ${{ env.REPORTS_DIR }}/security
          bandit -r src/ -f json -o ${{ env.REPORTS_DIR }}/security/bandit-report.json --severity-level medium || true
          bandit -r src/ -f html -o ${{ env.REPORTS_DIR }}/security/bandit-report.html --severity-level medium || true
          
          echo "📋 Bandit Summary:"
          bandit -r src/ --severity-level medium -f txt || true

      - name: 🔍 Run Safety (Dependency Check)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 CHECKING DEPENDENCIES FOR VULNERABILITIES"
          echo "═══════════════════════════════════════════════════════════"
          pip freeze > requirements-frozen.txt
          safety check -r requirements-frozen.txt --json > ${{ env.REPORTS_DIR }}/security/safety-report.json || true
          
          echo "📋 Safety Check Results:"
          safety check -r requirements-frozen.txt || true

      - name: 🔍 Run pip-audit
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 RUNNING PIP AUDIT"
          echo "═══════════════════════════════════════════════════════════"
          pip-audit --format json --output ${{ env.REPORTS_DIR }}/security/pip-audit-report.json || true
          
          echo "📋 pip-audit Results:"
          pip-audit || true

      - name: 🔍 Run Semgrep
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 RUNNING SEMGREP ANALYSIS"
          echo "═══════════════════════════════════════════════════════════"
          semgrep --config auto --json --output ${{ env.REPORTS_DIR }}/security/semgrep-report.json src/ || true

      - name: 🔍 Secret Scanning
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 SCANNING FOR SECRETS"
          echo "═══════════════════════════════════════════════════════════"
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '\.git/.*' > ${{ env.REPORTS_DIR }}/security/secrets-report.json || true

      - name: 📊 Generate Security Summary
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 SECURITY SCAN SUMMARY"
          echo "═══════════════════════════════════════════════════════════"
          
          cat > ${{ env.REPORTS_DIR }}/security/summary.md << 'EOF'
          # 🛡️ Security Scan Summary
          
          ## Scan Results
          
          | Tool | Status | Report |
          |------|--------|--------|
          | Bandit (SAST) | ✅ Complete | bandit-report.html |
          | Safety (Dependencies) | ✅ Complete | safety-report.json |
          | pip-audit | ✅ Complete | pip-audit-report.json |
          | Semgrep | ✅ Complete | semgrep-report.json |
          | Secret Scanner | ✅ Complete | secrets-report.json |
          
          ## Recommendations
          
          Review all reports in the security artifacts for detailed findings.
          EOF
          
          cat ${{ env.REPORTS_DIR }}/security/summary.md

      - name: 📤 Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: ${{ env.REPORTS_DIR }}/security/
          retention-days: 90

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 📊 CODE QUALITY ANALYSIS                                                                       ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  code-quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    needs: initialize
    if: ${{ needs.initialize.result == 'success' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy pylint flake8 radon xenon vulture

      - name: 🔍 Run Ruff (Fast Linter)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 RUNNING RUFF LINTER"
          echo "═══════════════════════════════════════════════════════════"
          mkdir -p ${{ env.REPORTS_DIR }}/quality
          ruff check src/ --output-format json > ${{ env.REPORTS_DIR }}/quality/ruff-report.json || true
          ruff check src/ --output-format text || true

      - name: 🔍 Run Black (Formatting Check)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 CHECKING CODE FORMATTING"
          echo "═══════════════════════════════════════════════════════════"
          black --check --diff src/ > ${{ env.REPORTS_DIR }}/quality/black-report.txt 2>&1 || true

      - name: 🔍 Run isort (Import Sorting)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 CHECKING IMPORT SORTING"
          echo "═══════════════════════════════════════════════════════════"
          isort --check-only --diff src/ > ${{ env.REPORTS_DIR }}/quality/isort-report.txt 2>&1 || true

      - name: 🔍 Run MyPy (Type Checking)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 RUNNING TYPE CHECKING"
          echo "═══════════════════════════════════════════════════════════"
          pip install types-all || true
          mypy src/ --ignore-missing-imports --html-report ${{ env.REPORTS_DIR }}/quality/mypy-html || true

      - name: 🔍 Run Radon (Complexity Analysis)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 ANALYZING CODE COMPLEXITY"
          echo "═══════════════════════════════════════════════════════════"
          radon cc src/ -a -s --json > ${{ env.REPORTS_DIR }}/quality/radon-cc-report.json || true
          radon mi src/ --json > ${{ env.REPORTS_DIR }}/quality/radon-mi-report.json || true
          
          echo "📋 Cyclomatic Complexity:"
          radon cc src/ -a -s || true
          
          echo "📋 Maintainability Index:"
          radon mi src/ -s || true

      - name: 🔍 Run Vulture (Dead Code Detection)
        continue-on-error: true
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔍 DETECTING DEAD CODE"
          echo "═══════════════════════════════════════════════════════════"
          vulture src/ --min-confidence 80 > ${{ env.REPORTS_DIR }}/quality/vulture-report.txt || true

      - name: 📊 Generate Quality Summary
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 CODE QUALITY SUMMARY"
          echo "═══════════════════════════════════════════════════════════"
          
          # Count lines of code
          echo "📏 Lines of Code:"
          find src/ -name "*.py" | xargs wc -l | tail -1
          
          # Generate summary
          cat > ${{ env.REPORTS_DIR }}/quality/summary.md << 'EOF'
          # 📊 Code Quality Summary
          
          ## Analysis Results
          
          | Tool | Purpose | Status |
          |------|---------|--------|
          | Ruff | Fast Linting | ✅ |
          | Black | Formatting | ✅ |
          | isort | Import Sorting | ✅ |
          | MyPy | Type Checking | ✅ |
          | Radon | Complexity | ✅ |
          | Vulture | Dead Code | ✅ |
          EOF

      - name: 📤 Upload Quality Reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: ${{ env.REPORTS_DIR }}/quality/
          retention-days: 90

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 🧪 TESTING                                                                                     ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: initialize
    if: ${{ needs.initialize.result == 'success' && github.event.inputs.run_tests != 'false' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        test-type: ['unit', 'integration']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio pytest-benchmark hypothesis
          pip install -e ".[dev,test]" || pip install -e . || true

      - name: 🧪 Run ${{ matrix.test-type }} Tests
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🧪 RUNNING ${{ matrix.test-type }} TESTS (Python ${{ matrix.python-version }})"
          echo "═══════════════════════════════════════════════════════════"
          
          mkdir -p ${{ env.REPORTS_DIR }}/tests
          
          pytest tests/${{ matrix.test-type }}/ \
            -v \
            --tb=short \
            --timeout=300 \
            -n auto \
            --cov=src \
            --cov-report=xml:${{ env.REPORTS_DIR }}/tests/coverage-${{ matrix.test-type }}-py${{ matrix.python-version }}.xml \
            --cov-report=html:${{ env.REPORTS_DIR }}/tests/coverage-html-${{ matrix.test-type }}-py${{ matrix.python-version }} \
            --junitxml=${{ env.REPORTS_DIR }}/tests/junit-${{ matrix.test-type }}-py${{ matrix.python-version }}.xml \
            || true

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-type }}-py${{ matrix.python-version }}
          path: ${{ env.REPORTS_DIR }}/tests/
          retention-days: 30

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 🔨 BUILD DESKTOP APPLICATION (MATRIX)                                                          ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  build:
    name: ${{ matrix.icon }} Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [initialize, security-scan, code-quality]
    if: |
      always() &&
      needs.initialize.result == 'success' &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.initialize.outputs.matrix_include) }}

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.initialize.outputs.version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Python Setup ───
      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ─── Cache Management ───
      - name: 💾 Setup Build Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            ~/Library/Caches/pip
            ~/AppData/Local/pip/Cache
            .nox
            .tox
            build/
          key: build-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            build-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.CACHE_VERSION }}-
            build-${{ matrix.platform }}-${{ matrix.arch }}-

      # ─── Python Dependencies ───
      - name: 📦 Install Python Dependencies
        shell: bash
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📦 INSTALLING PYTHON DEPENDENCIES"
          echo "═══════════════════════════════════════════════════════════"

          python -m pip install --upgrade pip setuptools wheel

          # Core dependencies
          pip install PySide6 qasync pyinstaller nuitka httpx websockets aiohttp

          # Build tools
          pip install pyinstaller-hooks-contrib

          # Windows-specific
          pip install pywin32 pywin32-ctypes pefile

          # Install project
          pip install -e . || pip install . || true

          echo "📋 Installed packages:"
          pip list

      # ─── Build Info Injection ───
      - name: 📝 Inject Build Information
        shell: pwsh
        run: |
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "📝 INJECTING BUILD INFORMATION"
          Write-Host "═══════════════════════════════════════════════════════════"

          $BUILD_INFO_FILE = "${{ env.DESKTOP_SRC }}/_build_info.py"

          $content = @"
          # Auto-generated build information
          # DO NOT EDIT MANUALLY

          __version__ = "${{ env.VERSION }}"
          __build_number__ = ${{ github.run_number }}
          __build_id__ = "${{ github.run_id }}"
          __build_date__ = "${{ needs.initialize.outputs.build_date }}"
          __build_timestamp__ = "${{ needs.initialize.outputs.build_timestamp }}"
          __commit_sha__ = "${{ github.sha }}"
          __commit_sha_short__ = "${{ needs.initialize.outputs.commit_sha_short }}"
          __branch__ = "${{ github.ref_name }}"
          __platform__ = "${{ matrix.platform }}"
          __arch__ = "${{ matrix.arch }}"
          __build_mode__ = "${{ env.BUILD_MODE }}"
          __build_type__ = "${{ env.BUILD_TYPE }}"
          __is_release__ = ${{ needs.initialize.outputs.is_release == 'true' && 'True' || 'False' }}
          __is_nightly__ = ${{ needs.initialize.outputs.is_nightly == 'true' && 'True' || 'False' }}
          "@

          $content | Out-File -FilePath $BUILD_INFO_FILE -Encoding utf8

          Write-Host "📋 Build info:"
          Get-Content $BUILD_INFO_FILE

      # ─── Build Executable ───
      - name: 🔨 Build Desktop Executable
        shell: pwsh
        run: |
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "🪟 BUILDING WINDOWS EXECUTABLE"
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "📋 Configuration:"
          Write-Host "  Platform: ${{ matrix.platform }}"
          Write-Host "  Architecture: ${{ matrix.arch }}"
          Write-Host "  Build Mode: ${{ env.BUILD_MODE }}"
          Write-Host "  Build Type: ${{ env.BUILD_TYPE }}"
          Write-Host "  Version: ${{ env.VERSION }}"
          Write-Host "═══════════════════════════════════════════════════════════"

          # Create output directories
          New-Item -ItemType Directory -Force -Path "${{ env.BUILD_OUTPUT }}" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ env.ARTIFACTS_DIR }}" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ env.INSTALLERS_DIR }}" | Out-Null

          # Check if build script exists
          $BUILD_SCRIPT = "${{ env.DESKTOP_SRC }}/build_exe.py"

          if (Test-Path $BUILD_SCRIPT) {
            python $BUILD_SCRIPT `
              --mode ${{ env.BUILD_MODE }} `
              --type ${{ env.BUILD_TYPE }} `
              --platform ${{ matrix.platform }} `
              --arch ${{ matrix.arch }} `
              --version ${{ env.VERSION }}
          } else {
            Write-Host "⚠️ Build script not found, using PyInstaller directly"

            # Find main entry point
            $ENTRY_POINT = $null
            foreach ($path in @("${{ env.DESKTOP_SRC }}/app_entry.py", "${{ env.DESKTOP_SRC }}/main.py", "${{ env.DESKTOP_SRC }}/__main__.py")) {
              if (Test-Path $path) {
                $ENTRY_POINT = $path
                break
              }
            }

            if (-not $ENTRY_POINT) {
              Write-Host "❌ No entry point found!"
              exit 1
            }

            Write-Host "📋 Using entry point: $ENTRY_POINT"

            # Run PyInstaller for Windows
            $ICON_PATH = "assets/icon.ico"
            if (Test-Path $ICON_PATH) {
              pyinstaller --onefile --clean --noconfirm --windowed `
                --name "${{ env.APP_NAME }}" `
                --distpath "${{ env.BUILD_OUTPUT }}" `
                --workpath "build/pyinstaller" `
                --specpath "build/specs" `
                --icon $ICON_PATH `
                $ENTRY_POINT
            } else {
              pyinstaller --onefile --clean --noconfirm --windowed `
                --name "${{ env.APP_NAME }}" `
                --distpath "${{ env.BUILD_OUTPUT }}" `
                --workpath "build/pyinstaller" `
                --specpath "build/specs" `
                $ENTRY_POINT
            }
          }

      # ─── Post-Build Processing ───
      - name: 🔧 Post-Build Processing
        shell: pwsh
        run: |
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "🔧 POST-BUILD PROCESSING"
          Write-Host "═══════════════════════════════════════════════════════════"

          Set-Location ${{ env.BUILD_OUTPUT }}

          $EXECUTABLE = "${{ env.APP_NAME }}.exe"

          if (Test-Path $EXECUTABLE) {
            Write-Host "✅ Found executable: $EXECUTABLE"

            # Rename with version and platform
            $NEW_NAME = "${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.artifact_ext }}"
            Move-Item $EXECUTABLE $NEW_NAME

            Write-Host "📋 Final executable: $NEW_NAME"
            Get-Item $NEW_NAME | Format-List Name, Length
          } else {
            Write-Host "❌ Executable not found!"
            Write-Host "📋 Directory contents:"
            Get-ChildItem
            exit 1
          }

      # ─── Create Installers (Windows) ───
      - name: 📦 Create Windows Installer (MSI)
        if: matrix.platform == 'windows' && env.CREATE_INSTALLERS == 'true'
        shell: pwsh
        run: |
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "📦 CREATING WINDOWS MSI INSTALLER"
          Write-Host "═══════════════════════════════════════════════════════════"
          
          # Check for WiX toolset
          $wixPath = "${env:WIX}bin"
          if (-not (Test-Path $wixPath)) {
            Write-Host "⚠️ WiX toolset not found, skipping MSI creation"
            exit 0
          }
          
          # Create WXS file
          $wxsContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" 
                     Name="${{ env.APP_NAME }}" 
                     Language="1033" 
                     Version="${{ needs.initialize.outputs.version_short }}.0" 
                     Manufacturer="${{ env.APP_AUTHOR }}" 
                     UpgradeCode="PUT-GUID-HERE">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine"/>
              <MediaTemplate EmbedCab="yes"/>
              
              <Feature Id="ProductFeature" Title="${{ env.APP_NAME }}" Level="1">
                <ComponentGroupRef Id="ProductComponents"/>
              </Feature>
              
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="${{ env.APP_NAME }}">
                    <Component Id="MainExecutable" Guid="*">
                      <File Id="MainEXE" Source="dist/${{ env.APP_NAME }}.exe" KeyPath="yes"/>
                    </Component>
                  </Directory>
                </Directory>
              </Directory>
              
              <ComponentGroup Id="ProductComponents">
                <ComponentRef Id="MainExecutable"/>
              </ComponentGroup>
            </Product>
          </Wix>
          "@
          
          Write-Host "📋 MSI creation skipped (WiX configuration needed)"

      # ─── Code Signing (Windows) ───
      - name: 🔐 Sign Windows Executable
        if: matrix.platform == 'windows' && env.ENABLE_SIGNING == 'true' && needs.initialize.outputs.is_release == 'true'
        shell: pwsh
        run: |
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "🔐 SIGNING WINDOWS EXECUTABLE"
          Write-Host "═══════════════════════════════════════════════════════════"
          
          # Check for signing certificate
          if (-not $env:WINDOWS_SIGNING_CERT) {
            Write-Host "⚠️ No signing certificate configured, skipping"
            exit 0
          }
          
          Write-Host "📋 Code signing would be performed here with signtool"
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

      # ─── Generate Build Report ───
      - name: 📊 Generate Build Report
        shell: bash
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 GENERATING BUILD REPORT"
          echo "═══════════════════════════════════════════════════════════"
          
          mkdir -p ${{ env.REPORTS_DIR }}/build
          
          cat > ${{ env.REPORTS_DIR }}/build/build-report-${{ matrix.platform }}-${{ matrix.arch }}.json << EOF
          {
            "platform": "${{ matrix.platform }}",
            "arch": "${{ matrix.arch }}",
            "version": "${{ env.VERSION }}",
            "build_number": ${{ github.run_number }},
            "build_id": "${{ github.run_id }}",
            "build_mode": "${{ env.BUILD_MODE }}",
            "build_type": "${{ env.BUILD_TYPE }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": [
              $(cd ${{ env.BUILD_OUTPUT }} && ls -1 | sed 's/.*/"&"/' | paste -sd,)
            ],
            "installers": [
              $(cd ${{ env.INSTALLERS_DIR }} 2>/dev/null && ls -1 | sed 's/.*/"&"/' | paste -sd, || echo "")
            ],
            "status": "success"
          }
          EOF
          
          cat ${{ env.REPORTS_DIR }}/build/build-report-${{ matrix.platform }}-${{ matrix.arch }}.json

      # ─── Show Build Summary ───
      - name: 📊 Build Summary
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════════════════════════════════════╗"
          echo "║                              ${{ matrix.icon }} BUILD SUMMARY                                    ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          echo "║ Platform:     ${{ matrix.platform }}"
          echo "║ Architecture: ${{ matrix.arch }}"
          echo "║ Version:      ${{ env.VERSION }}"
          echo "║ Build Mode:   ${{ env.BUILD_MODE }}"
          echo "║ Build Type:   ${{ env.BUILD_TYPE }}"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          echo "║ 📦 ARTIFACTS:"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          
          if [ -d "${{ env.BUILD_OUTPUT }}" ]; then
            ls -lh ${{ env.BUILD_OUTPUT }}/ | while read line; do
              echo "║   $line"
            done
          fi
          
          if [ -d "${{ env.INSTALLERS_DIR }}" ] && [ "$(ls -A ${{ env.INSTALLERS_DIR }})" ]; then
            echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
            echo "║ 📦 INSTALLERS:"
            echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
            ls -lh ${{ env.INSTALLERS_DIR }}/ | while read line; do
              echo "║   $line"
            done
          fi
          
          echo "╚══════════════════════════════════════════════════════════════════════════════════════════════════╝"

      # ─── Upload Artifacts ───
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.BUILD_OUTPUT }}/${{ env.APP_NAME }}-*
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Installers
        if: env.CREATE_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.INSTALLERS_DIR }}/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📤 Upload Build Reports
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.REPORTS_DIR }}/build/
          retention-days: 90

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 📦 AGGREGATE ARTIFACTS                                                                         ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  aggregate-artifacts:
    name: 📦 Aggregate Build Artifacts
    runs-on: ubuntu-latest
    needs: [initialize, build]
    if: |
      always() &&
      needs.initialize.result == 'success' &&
      needs.build.result == 'success'

    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: 📦 Organize Artifacts
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📦 ORGANIZING ARTIFACTS"
          echo "═══════════════════════════════════════════════════════════"
          
          mkdir -p release/executables
          mkdir -p release/installers
          mkdir -p release/reports
          
          # Move executables
          find all-artifacts -name "${{ env.APP_NAME }}-*" -type f ! -name "*.json" ! -name "*.md" | while read f; do
            cp "$f" release/executables/ 2>/dev/null || true
          done
          
          # Move installers
          for ext in deb rpm dmg msi AppImage; do
            find all-artifacts -name "*.$ext" -type f | while read f; do
              cp "$f" release/installers/ 2>/dev/null || true
            done
          done
          
          # Move reports
          find all-artifacts -name "*.json" -o -name "*.md" -o -name "*.html" | while read f; do
            cp "$f" release/reports/ 2>/dev/null || true
          done
          
          echo "📋 Release structure:"
          find release -type f | head -50

      - name: 📊 Generate Checksums
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 GENERATING CHECKSUMS"
          echo "═══════════════════════════════════════════════════════════"
          
          cd release
          
          # SHA256 checksums
          find . -type f ! -name "*.sha256" ! -name "*.md5" | while read f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          
          echo "📋 SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: 📤 Upload Aggregated Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release-${{ needs.initialize.outputs.version }}
          path: release/
          retention-days: 90

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 🚀 CREATE GITHUB RELEASE                                                                       ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [initialize, build, aggregate-artifacts]
    if: |
      always() &&
      needs.initialize.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.initialize.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release-${{ needs.initialize.outputs.version }}
          path: release/

      - name: 📝 Generate Release Notes
        id: release-notes
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📝 GENERATING RELEASE NOTES"
          echo "═══════════════════════════════════════════════════════════"
          
          VERSION="${{ needs.initialize.outputs.version }}"
          
          cat > RELEASE_NOTES.md << EOF
          # 🚀 ${{ env.APP_NAME }} v${VERSION}
          
          ## 📋 Release Information
          
          | Property | Value |
          |----------|-------|
          | Version | \`${VERSION}\` |
          | Build | #${{ github.run_number }} |
          | Date | ${{ needs.initialize.outputs.build_date }} |
          | Commit | \`${{ needs.initialize.outputs.commit_sha_short }}\` |
          
          ## 📦 Downloads
          
          ### Executables
          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | 🪟 Windows | x64 | \`${{ env.APP_NAME }}-${VERSION}-windows-x64.exe\` |
          | 🐧 Linux | x64 | \`${{ env.APP_NAME }}-${VERSION}-linux-x64\` |
          | 🍎 macOS | Universal | \`${{ env.APP_NAME }}-${VERSION}-macos-universal\` |
          
          ### Installers
          | Format | Platform | File |
          |--------|----------|------|
          | DEB | Linux (Debian/Ubuntu) | \`${{ env.APP_NAME }}-${VERSION}-x64.deb\` |
          | AppImage | Linux (Universal) | \`${{ env.APP_NAME }}-${VERSION}-x64.AppImage\` |
          | DMG | macOS | \`${{ env.APP_NAME }}-${VERSION}-universal.dmg\` |
          
          ## 📝 Changelog
          
          ${{ needs.initialize.outputs.changelog }}
          
          ## 🔐 Verification
          
          All releases include SHA256 checksums. Verify your download:
          
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          
          ## 📚 Documentation
          
          - [User Guide](https://docs.nebulacompute.io)
          - [API Reference](https://api.nebulacompute.io)
          - [Release Notes](https://github.com/${{ github.repository }}/releases)
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${VERSION}...HEAD
          EOF
          
          cat RELEASE_NOTES.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} v${{ needs.initialize.outputs.version }}
          tag_name: v${{ needs.initialize.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            release/executables/*
            release/installers/*
            release/SHA256SUMS.txt
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.initialize.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ 🔔 NOTIFICATIONS                                                                               ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  notify:
    name: 🔔 Send Notifications
    runs-on: ubuntu-latest
    needs: [initialize, build, release]
    if: always()

    steps:
      - name: 📊 Determine Build Status
        id: status
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          if [ "$BUILD_RESULT" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          elif [ "$BUILD_RESULT" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "$BUILD_RESULT" == "skipped" ]; then
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "emoji=⏭️" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          fi

      - name: 🔔 Slack Notification
        if: ${{ github.event.inputs.notify_channels == 'all' || github.event.inputs.notify_channels == 'slack' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} ${{ env.APP_NAME }} Desktop Build"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Version:*\n${{ needs.initialize.outputs.version }}"},
                    {"type": "mrkdwn", "text": "*Status:*\n${{ steps.status.outputs.status }}"},
                    {"type": "mrkdwn", "text": "*Build:*\n#${{ github.run_number }}"},
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Build"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 🔔 Discord Notification
        if: ${{ github.event.inputs.notify_channels == 'all' || github.event.inputs.notify_channels == 'discord' }}
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "${{ steps.status.outputs.emoji }} ${{ env.APP_NAME }} Desktop Build",
                  "description": "Build #${{ github.run_number }} - ${{ steps.status.outputs.status }}",
                  "color": ${{ steps.status.outputs.status == 'success' && '3066993' || '15158332' }},
                  "fields": [
                    {"name": "Version", "value": "${{ needs.initialize.outputs.version }}", "inline": true},
                    {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true}
                  ],
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }]
              }' \
              "${{ secrets.DISCORD_WEBHOOK_URL }}"
          fi

  # ╔════════════════════════════════════════════════════════════════════════════════════════════════╗
  # ║ ✅ FINAL STATUS                                                                                ║
  # ╚════════════════════════════════════════════════════════════════════════════════════════════════╝
  final-status:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs: [initialize, security-scan, code-quality, test, build, aggregate-artifacts, release, notify]
    if: always()

    steps:
      - name: 📊 Generate Final Report
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════════════════════════════════════╗"
          echo "║                                                                                                  ║"
          echo "║  ███████╗██╗███╗   ██╗ █████╗ ██╗         ███████╗████████╗ █████╗ ████████╗██╗   ██╗███████╗    ║"
          echo "║  ██╔════╝██║████╗  ██║██╔══██╗██║         ██╔════╝╚══██╔══╝██╔══██╗╚══██╔══╝██║   ██║██╔════╝    ║"
          echo "║  █████╗  ██║██╔██╗ ██║███████║██║         ███████╗   ██║   ███████║   ██║   ██║   ██║███████╗    ║"
          echo "║  ██╔══╝  ██║██║╚██╗██║██╔══██║██║         ╚════██║   ██║   ██╔══██║   ██║   ██║   ██║╚════██║    ║"
          echo "║  ██║     ██║██║ ╚████║██║  ██║███████╗    ███████║   ██║   ██║  ██║   ██║   ╚██████╔╝███████║    ║"
          echo "║  ╚═╝     ╚═╝╚═╝  ╚═══╝╚═╝  ╚═╝╚══════╝    ╚══════╝   ╚═╝   ╚═╝  ╚═╝   ╚═╝    ╚═════╝ ╚══════╝    ║"
          echo "║                                                                                                  ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          echo "║                                    🖥️ DESKTOP BUILD PIPELINE                                     ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          echo "║                                                                                                  ║"
          echo "║  📋 BUILD INFORMATION                                                                            ║"
          echo "║  ─────────────────────────────────────────────────────────────────────────────────────────────   ║"
          echo "║  Version:      ${{ needs.initialize.outputs.version }}"
          echo "║  Build:        #${{ github.run_number }}"
          echo "║  Commit:       ${{ needs.initialize.outputs.commit_sha_short }}"
          echo "║  Branch:       ${{ github.ref_name }}"
          echo "║  Date:         ${{ needs.initialize.outputs.build_date }}"
          echo "║                                                                                                  ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          echo "║                                                                                                  ║"
          echo "║  📊 JOB STATUS                                                                                   ║"
          echo "║  ─────────────────────────────────────────────────────────────────────────────────────────────   ║"
          echo "║                                                                                                  ║"
          
          # Status icons
          get_icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "⏹️";;
              skipped) echo "⏭️";;
              *) echo "❓";;
            esac
          }
          
          echo "║  $(get_icon ${{ needs.initialize.result }}) Initialize:      ${{ needs.initialize.result }}"
          echo "║  $(get_icon ${{ needs.security-scan.result }}) Security Scan:   ${{ needs.security-scan.result }}"
          echo "║  $(get_icon ${{ needs.code-quality.result }}) Code Quality:    ${{ needs.code-quality.result }}"
          echo "║  $(get_icon ${{ needs.test.result }}) Test Suite:      ${{ needs.test.result }}"
          echo "║  $(get_icon ${{ needs.build.result }}) Build:           ${{ needs.build.result }}"
          echo "║  $(get_icon ${{ needs.aggregate-artifacts.result }}) Aggregate:       ${{ needs.aggregate-artifacts.result }}"
          echo "║  $(get_icon ${{ needs.release.result }}) Release:         ${{ needs.release.result }}"
          echo "║  $(get_icon ${{ needs.notify.result }}) Notifications:   ${{ needs.notify.result }}"
          echo "║                                                                                                  ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════════════════════════╣"
          echo "║                                                                                                  ║"
          
          # Overall status
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "║  🎉 OVERALL STATUS: SUCCESS                                                                      ║"
            echo "║                                                                                                  ║"
            echo "║  All desktop builds completed successfully!                                                      ║"
          else
            echo "║  ⚠️ OVERALL STATUS: NEEDS ATTENTION                                                               ║"
            echo "║                                                                                                  ║"
            echo "║  Some jobs may have failed or were skipped.                                                      ║"
          fi
          
          echo "║                                                                                                  ║"
          echo "╚══════════════════════════════════════════════════════════════════════════════════════════════════╝"
          
          # Exit with appropriate code (allow skipped as success)
          BUILD_RESULT="${{ needs.build.result }}"
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then
            exit 1
          fi
