# ═══════════════════════════════════════════════════════════════════════════════
# 🚀 ENTERPRISE-GRADE PYTHON CI/CD PIPELINE WITH CONDA
# ═══════════════════════════════════════════════════════════════════════════════
# Project: theEnd - Advanced AI Assistant
# Repository: https://github.com/salahuddin1992/theEnd
# Branch: claude/distributed-computing-setup-Dbr0W
# ═══════════════════════════════════════════════════════════════════════════════

name: 🐍 Python CI/CD Pipeline with Conda

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: 'false'
        type: boolean
      deploy_env:
        description: 'Deployment environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  schedule:
    # Run daily at 2 AM UTC for security scanning
    - cron: '0 2 * * *'

# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION_PRIMARY: '3.11'
  CONDA_ENV_NAME: 'theend-env'
  CACHE_NUMBER: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  PROJECT_NAME: 'theEnd'
  MIN_COVERAGE: 70

# ═══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY CONTROL
# ═══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ═══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write

# ═══════════════════════════════════════════════════════════════════════════════
# JOBS
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 📋 PRE-FLIGHT CHECKS
  # ─────────────────────────────────────────────────────────────────────────────
  pre-flight:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      docs_changed: ${{ steps.paths_filter.outputs.docs }}
      python_changed: ${{ steps.paths_filter.outputs.python }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 Check for Duplicate Runs
        id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'

      - name: 📂 Detect Changed Paths
        id: paths_filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - '**/*.py'
            tests:
              - 'tests/**'
              - 'test_*.py'
            config:
              - '*.yml'
              - '*.yaml'
              - '*.toml'
              - 'pyproject.toml'
              - 'setup.py'
              - 'setup.cfg'
            docs:
              - 'docs/**'
              - '*.md'
              - '*.rst'
            conda:
              - 'environment*.yml'
              - 'conda*.yml'

  # ─────────────────────────────────────────────────────────────────────────────
  # 🔒 SECURITY SCANNING
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: pre-flight
    if: needs.pre-flight.outputs.should_skip != 'true'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      - name: 🔐 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: 📤 Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─────────────────────────────────────────────────────────────────────────────
  # 🧪 MAIN TEST MATRIX
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: [pre-flight]
    if: |
      needs.pre-flight.outputs.should_skip != 'true' &&
      github.event.inputs.skip_tests != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          miniforge-variant: Mambaforge
          miniforge-version: latest
          use-mamba: true
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          environment-file: environment.yml
          auto-activate-base: false

      - name: 📦 Cache Conda Environment
        uses: actions/cache@v4
        id: conda-cache
        with:
          path: |
            ~/conda_pkgs_dir
            ~/.conda
            ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: conda-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('environment.yml', 'requirements*.txt') }}-${{ env.CACHE_NUMBER }}
          restore-keys: |
            conda-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: 🔧 Install Dependencies
        shell: bash -el {0}
        run: |
          echo "📦 Installing dependencies..."

          # Update conda environment if cache miss
          if [ "${{ steps.conda-cache.outputs.cache-hit }}" != "true" ]; then
            mamba env update -n ${{ env.CONDA_ENV_NAME }} -f environment.yml --prune || true
          fi

          # Install development/linting tools via pip (more reliable than mamba for these)
          pip install ruff black mypy bandit

          # Install package in development mode
          if [ -f "pyproject.toml" ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi

      - name: 📋 Display Environment Info
        shell: bash -el {0}
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🔧 Environment Information"
          echo "═══════════════════════════════════════════════════════════"
          echo "Python Version: $(python --version)"
          echo "Conda Version: $(conda --version)"
          echo "Mamba Version: $(mamba --version)"
          echo "Platform: ${{ runner.os }}"
          echo "═══════════════════════════════════════════════════════════"
          echo "📦 Installed Packages:"
          conda list
          echo "═══════════════════════════════════════════════════════════"

      - name: 🎨 Code Formatting Check (Black)
        shell: bash -el {0}
        continue-on-error: true
        run: |
          echo "🎨 Checking code formatting with Black..."
          black --check --diff --line-length 120 . || echo "⚠️ Some files need formatting"

      - name: 🔍 Lint with Ruff
        shell: bash -el {0}
        run: |
          echo "🔍 Running Ruff linter..."

          # Run ruff check (uses pyproject.toml config)
          ruff check src/ tests/ --output-format=github || echo "⚠️ Some linting issues found"

      - name: 🔒 Security Lint with Bandit
        shell: bash -el {0}
        continue-on-error: true
        run: |
          echo "🔒 Running Bandit security linter..."
          bandit -r . -x ./tests,./test,./.conda,./.venv,./venv -f json -o bandit-report.json || true
          bandit -r . -x ./tests,./test,./.conda,./.venv,./venv -ll || echo "⚠️ Security issues found"

      - name: 📝 Type Checking with MyPy
        shell: bash -el {0}
        continue-on-error: true
        run: |
          echo "📝 Running MyPy type checker..."
          mypy . --ignore-missing-imports --no-error-summary || echo "⚠️ Type errors found"

      - name: 🧪 Run Tests with pytest
        shell: bash -el {0}
        run: |
          echo "🧪 Running tests with pytest..."

          # Create test results directory
          mkdir -p test-results

          # Install the package in editable mode
          pip install -e . --no-deps || true

          # Run pytest with coverage (without parallel execution for stability)
          pytest \
            --verbose \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --junitxml=test-results/junit.xml \
            --timeout=300 \
            --ignore=.conda \
            --ignore=.venv \
            --ignore=venv \
            tests/ \
            || echo "⚠️ Some tests failed"

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
            htmlcov/
            bandit-report.json
          retention-days: 30

      - name: 📋 Test Report
        uses: dorny/test-reporter@v1
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # 🔗 DEPENDENCY CHECK
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: 🔗 Dependency Security Check
    runs-on: ubuntu-latest
    needs: pre-flight
    if: needs.pre-flight.outputs.should_skip != 'true'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          miniforge-variant: Mambaforge
          miniforge-version: latest
          use-mamba: true
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          environment-file: environment.yml
          auto-activate-base: false

      - name: 📦 Install Project Dependencies
        shell: bash -el {0}
        run: |
          echo "📦 Installing project dependencies..."
          pip install -e . || pip install . || echo "⚠️ Package installation skipped"

      - name: 🔍 Check Dependencies with pip-audit
        shell: bash -el {0}
        continue-on-error: true
        run: |
          pip install pip-audit

          echo "🔍 Running pip-audit..."
          pip-audit --strict || echo "⚠️ Some vulnerabilities found (non-blocking)"

      - name: 📊 Generate Dependency Graph
        shell: bash -el {0}
        run: |
          mamba install -y pipdeptree
          echo "📊 Dependency Tree:"
          pipdeptree --warn silence || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 📚 DOCUMENTATION BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    needs: pre-flight
    if: |
      needs.pre-flight.outputs.should_skip != 'true' &&
      needs.pre-flight.outputs.docs_changed == 'true'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          miniforge-variant: Mambaforge
          use-mamba: true
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          auto-activate-base: false

      - name: 📚 Build Documentation
        shell: bash -el {0}
        run: |
          mamba install -y sphinx sphinx_rtd_theme myst-parser
          
          if [ -d "docs" ]; then
            cd docs
            make html || echo "⚠️ Documentation build had warnings"
          else
            echo "📝 No docs directory found, skipping documentation build"
          fi

      - name: 📤 Upload Documentation
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # 📦 BUILD PACKAGE
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: [test]
    if: success()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          miniforge-variant: Mambaforge
          use-mamba: true
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          auto-activate-base: false

      - name: 📦 Build Package
        shell: bash -el {0}
        run: |
          mamba install -y build twine wheel setuptools
          
          echo "📦 Building package..."
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            python -m build
            
            echo "🔍 Checking package with twine..."
            twine check dist/*
          else
            echo "⚠️ No pyproject.toml or setup.py found, skipping build"
          fi

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # 🐳 DOCKER BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      success() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        if: hashFiles('Dockerfile') != ''
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # ✅ FINAL STATUS
  # ─────────────────────────────────────────────────────────────────────────────
  status:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: 📊 Check Pipeline Status
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 PIPELINE STATUS REPORT"
          echo "═══════════════════════════════════════════════════════════"
          echo "🧪 Tests: ${{ needs.test.result }}"
          echo "═══════════════════════════════════════════════════════════"

          # Check for actual failures (not skipped)
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Pipeline failed due to test failures"
            exit 1
          fi

          echo "✅ Pipeline completed!"

      - name: 📢 Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            
            console.log(`❌ Pipeline failed! Check: ${run_url}`);

  # ─────────────────────────────────────────────────────────────────────────────
  # 🚀 DEPLOY (Optional - on main/master only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, build, status]
    if: |
      success() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      github.event_name == 'push'
    environment:
      name: ${{ github.event.inputs.deploy_env || 'staging' }}
      url: https://${{ github.event.inputs.deploy_env || 'staging' }}.example.com
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: 🚀 Deploy to Environment
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🚀 DEPLOYMENT"
          echo "═══════════════════════════════════════════════════════════"
          echo "Environment: ${{ github.event.inputs.deploy_env || 'staging' }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "═══════════════════════════════════════════════════════════"
          
          # Add your deployment commands here
          # Example: pip install dist/*.whl
          # Example: kubectl apply -f k8s/
          
          echo "✅ Deployment placeholder - add your deployment commands"
