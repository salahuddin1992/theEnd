# ═══════════════════════════════════════════════════════════════════════════════
# 🚀 PYTHON CI/CD PIPELINE
# ═══════════════════════════════════════════════════════════════════════════════
# Project: theEnd - Distributed Computing System
# ═══════════════════════════════════════════════════════════════════════════════

name: 🐍 Python CI/CD Pipeline with Conda

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION_PRIMARY: '3.11'
  PROJECT_NAME: 'theEnd'

# ═══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY CONTROL
# ═══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ═══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write

# ═══════════════════════════════════════════════════════════════════════════════
# JOBS
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 🧪 MAIN TEST MATRIX
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio pytest-cov pytest-timeout
          pip install -e .

      - name: 🎨 Code Formatting Check (Black)
        run: |
          black --check --diff --line-length 120 . || echo "Some files need formatting"
        continue-on-error: true

      - name: 🔍 Lint with Ruff
        run: |
          ruff check src/ tests/ --output-format=github || echo "Some linting issues found"
        continue-on-error: true

      - name: 📝 Type Checking with MyPy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary || echo "Type errors found"
        continue-on-error: true

      - name: 🧪 Run Tests with pytest
        run: |
          pytest tests/ -v --tb=short --timeout=300

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 🔗 DEPENDENCY CHECK
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: 🔗 Dependency Security Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . || echo "Package installation completed"

      - name: 🔍 Check Dependencies with pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict || echo "Some vulnerabilities found (non-blocking)"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 📚 DOCUMENTATION BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    needs: [test]
    if: success()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📚 Build Documentation
        run: |
          pip install sphinx sphinx_rtd_theme myst-parser
          if [ -d "docs" ]; then
            cd docs && make html || echo "Documentation build had warnings"
          else
            echo "No docs directory found - skipping"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 📦 BUILD PACKAGE
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: [test]
    if: success()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Build Package
        run: |
          pip install build twine wheel setuptools
          python -m build
          twine check dist/*

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # 🐳 DOCKER BUILD
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: success()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        if: hashFiles('Dockerfile') != ''
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # ✅ FINAL STATUS
  # ─────────────────────────────────────────────────────────────────────────────
  status:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: always()
    steps:
      - name: 📊 Check Pipeline Status
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 PIPELINE STATUS REPORT"
          echo "═══════════════════════════════════════════════════════════"
          echo "🧪 Tests: ${{ needs.test.result }}"
          echo "🔗 Dependency Check: ${{ needs.dependency-check.result }}"
          echo "═══════════════════════════════════════════════════════════"

          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Pipeline failed due to test failures"
            exit 1
          fi

          echo "✅ Pipeline completed successfully!"

  # ─────────────────────────────────────────────────────────────────────────────
  # 🚀 DEPLOY
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, build, status]
    if: success()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: 🚀 Deploy to Environment
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "🚀 DEPLOYMENT"
          echo "═══════════════════════════════════════════════════════════"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ Deployment placeholder - add your deployment commands"
